[package]
name = "jarvis-desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3"

# macOS-only: WKWebView escape hatch to lift the autoplay/user-action gate so
# TTS plays hands-free (RESEARCH Q1). Pinned to the minors already resolved
# transitively via wry/tauri to avoid a second copy in the tree; `with_webview`
# hands us the raw WKWebView pointer we cast through these bindings.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace]
# Self-contained workspace — does NOT belong to a parent Cargo workspace.
# The repo root has no Cargo.toml (JS monorepo). See RESEARCH Pitfall 4.
