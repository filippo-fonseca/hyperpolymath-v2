[package]
name = "jarvis-desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "unstable"] }
tauri-plugin-store = "2"
tauri-plugin-http = "2"
# Direct reqwest for the whatsapp_reconnect Tauri command's POST /api/logout
# to the local bridge. Matches the version already pulled transitively by
# tauri-plugin-http so no duplicate copy is added to the tree.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3"
# TTS playback happens natively in Rust (NOT the WKWebView). A global hotkey
# gives no in-webview user gesture, so WebKit keeps the AudioContext suspended
# → no sound + `onended` never fires → the FSM hangs on "speaking". rodio owns
# a real CoreAudio output stream on its own thread, sidestepping the webview.
rodio = { version = "0.19", default-features = false }
# Keyboard/mouse injection via CGEvent (RESEARCH Q5). Requires the
# Accessibility TCC permission — without it, calls return Ok(()) but do
# NOTHING, so computer.rs gates every input command on AXIsProcessTrusted.
enigo = "0.6"

# macOS-only: WKWebView escape hatch to lift the autoplay/user-action gate so
# TTS plays hands-free (RESEARCH Q1). Pinned to the minors already resolved
# transitively via wry/tauri to avoid a second copy in the tree; `with_webview`
# hands us the raw WKWebView pointer we cast through these bindings.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = "0.3"
# NSWindow escape hatch for the flowpill overlay (see src/flowpill.rs): window
# level, collection behaviour, and the canBecomeKeyWindow assertion that proves
# the window is non-activating. Already in the lock tree transitively via
# tao/wry/muda at 0.3.2, so declaring it direct adds no second copy.
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSResponder",
  "NSWindow",
] }

# CGEventTap for the global bare-Option gesture tap (optiontap.rs). Rolled on
# `core-graphics` directly rather than pulling `tauri-plugin-macos-input-monitor`:
# both crates are already resolved in this tree (via enigo/wry), the tap we need
# is one listen-only FlagsChanged mask, and the double-tap / long-press timing
# has to live in our own testable state machine either way. Pinned to the minors
# already in Cargo.lock so no second copy joins the tree.
core-graphics = "0.25"
core-foundation = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace]
# Self-contained workspace — does NOT belong to a parent Cargo workspace.
# The repo root has no Cargo.toml (JS monorepo). See RESEARCH Pitfall 4.
