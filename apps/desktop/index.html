<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JARVIS</title>
    <!-- The sd register (unit 1): vendored Space Grotesk + JetBrains Mono
         @font-face, then the --sd-* design vocabulary. index.html no longer
         declares its own palette — every surface/ink/accent below resolves
         through the sd ladder. Linked before the inline block so the block
         consumes the tokens. -->
    <link rel="stylesheet" href="/src/styles/sd-fonts.css" />
    <link rel="stylesheet" href="/src/styles/sd-tokens.css" />
    <style>
      :root {
        color-scheme: dark;
        /* Space Grotesk is the app sans. The register forbids serif as body /
           transcript text (oracle O1): EB Garamond is logotype-only, and this
           chrome has no logotype, so no serif face is loaded at all. */
        font-family: var(--font-sans);
        /* --accent-hi is the one HUD var with no direct sd twin: the brighter
           cyan used for checkmark strokes and the recording state. Point it at
           the sd "faint" (brighter) accent so the app still speaks a single hue.
           Every other palette name (--sd-app, --sd-box, --sd-ink[-faint],
           --sd-line, --sd-accent, --ink-amber, --ink-coral, --font-mono) comes
           from sd-tokens.css. */
        --accent-hi: var(--sd-accent-faint);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        /* Flat sd canvas — the register swaps the old radial wash for one
           recessed --sd-app; depth reads through the panel ladder, not a glow. */
        background: var(--sd-app);
        color: var(--sd-ink);
        overflow: hidden;
        user-select: none;
      }

      /* ── Stage: three fixed regions in a column grid ───────────────────────
         [header]      auto — never scrolls, never shrinks
         [transcript]  1fr  — the ONLY scroll region; text can never overlap
         [footer/btn]  auto — pinned to the bottom
         The min-height:0 on the middle row is what lets it scroll instead of
         pushing the footer off-screen (CSS grid overflow gotcha). Responsive to
         window resize because every dimension is relative / clamped. */
      .stage {
        position: relative;
        z-index: 1;
        height: 100vh;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        row-gap: 12px;
        padding: 16px 18px 18px;
      }

      /* ── Header: compact status and optional routine progress ── */
      .hud-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding-top: 4px;
      }
      .routine-ring-slot {
        position: relative;
        width: 112px;
        height: 0;
        display: grid; place-items: center;
        opacity: 0;
        transition: height 0.3s ease, opacity 0.3s ease;
      }
      body[data-routine="active"] .routine-ring-slot {
        height: 112px;
        opacity: 1;
      }

      /* Status glyph — tiny mono line under the orb (font-mono-stats). */
      .status-line {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--sd-ink-faint);
        transition: color 0.3s ease;
      }
      body[data-jarvis-state="listening"] .status-line { color: var(--sd-accent); }
      body[data-jarvis-state="speaking"] .status-line { color: var(--sd-accent); }
      body[data-jarvis-state="thinking"] .status-line { color: var(--sd-accent); opacity: 0.8; }
      /* Tiny connection dot next to the status word. */
      .status-line .conn-dot {
        display: inline-block; width: 6px; height: 6px; border-radius: 50%;
        margin-right: 7px; vertical-align: middle;
        background: var(--sd-ink-faint); transition: background 0.3s, box-shadow 0.3s;
      }
      body[data-sse="connected"] .status-line .conn-dot {
        background: var(--sd-accent); box-shadow: 0 0 6px color-mix(in srgb, var(--sd-accent) 70%, transparent);
      }
      body[data-sse="error"] .status-line .conn-dot { background: var(--ink-coral); }
      /* Voice-degraded chip: amber (the guarded/attention register), sits after
         the status word. Hidden via the [hidden] attribute until TTS falls back
         to the local voice; a soft pulse draws the eye without shouting. */
      .status-line .voice-degraded {
        display: inline-flex; align-items: center;
        margin-left: 9px; padding: 1px 6px;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--ink-amber) 45%, transparent);
        color: var(--ink-amber);
        background: color-mix(in srgb, var(--ink-amber) 12%, transparent);
        letter-spacing: 0.1em;
        animation: voice-degraded-pulse 2s ease-in-out infinite;
      }
      .status-line .voice-degraded[hidden] { display: none; }
      .status-line .voice-degraded::before {
        content: ""; display: inline-block;
        width: 5px; height: 5px; border-radius: 50%;
        margin-right: 5px; background: var(--ink-amber);
        box-shadow: 0 0 6px color-mix(in srgb, var(--ink-amber) 80%, transparent);
      }
      @keyframes voice-degraded-pulse {
        0%, 100% { opacity: 0.72; }
        50% { opacity: 1; }
      }

      /* Disconnect banner — an always-visible top strip whenever the JARVIS
         server / device-token link is down, so the user never has to open
         Settings to discover the HUD is offline. Hidden unless the SSE bus is
         in the error state; tap it to jump straight to Settings. */
      .disconnect-banner {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 60;
        padding: 7px 30px 7px 12px;
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-align: center;
        color: var(--ink-coral);
        background: color-mix(in srgb, var(--ink-coral) 16%, var(--sd-box));
        border: none;
        border-bottom: 1px solid color-mix(in srgb, var(--ink-coral) 45%, transparent);
        cursor: pointer;
      }
      body[data-sse="error"] .disconnect-banner { display: block; }

      /* Acknowledge strip — auto-fading first-clause echo of each JARVIS
         utterance (src/hud/ack-strip.ts). Fixed height so the fade never
         shifts the grid; opacity is the only thing that moves. */
      .ack-strip {
        height: 15px;
        max-width: min(420px, 86vw);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-align: center;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--sd-accent);
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      .ack-strip.visible { opacity: 1; }

      /* ── Routine progress ring — a conic-gradient arc that fills as a
         synthesize routine's sources settle (src/hud/routine-loader.ts). The fill
         is driven by a single CSS custom property, --progress (an angle 0→360deg),
         so advancing a source is one cheap GPU transition — no rAF loop (the orb
         already owns one). The track is a faint full circle; the arc is the cyan
         conic gradient masked to a thin annulus. ── */
      .routine-ring {
        position: absolute;
        left: 50%; top: 50%;
        width: 80%; height: 80%;
        transform: translate(-50%, -50%) scale(0.86);
        border-radius: 50%;
        display: grid; place-items: center;
        opacity: 0;
        /* Cyan arc for 0→--progress, transparent for the remainder, over a faint
           track laid underneath via the second (radial) layer's border. */
        --progress: 0deg;
        background:
          conic-gradient(
            from -90deg,
            var(--accent-hi) 0deg,
            var(--sd-accent) var(--progress),
            transparent var(--progress) 360deg
          );
        /* Mask the disc to a thin ring so only the annulus shows. */
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
                mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                    background 0.5s ease;
        pointer-events: none;
      }
      /* Faint always-there track behind the fill (a separate element would need
         markup; a box-shadow inset ring reads the same at this scale). */
      .routine-ring::before {
        content: "";
        position: absolute; inset: 0; border-radius: 50%;
        border: 3px solid color-mix(in srgb, var(--sd-accent) 12%, transparent);
      }
      body[data-routine="active"] .routine-ring {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      /* The label is unmasked (it lives above the masked ring background). */
      .routine-ring-label {
        position: absolute; left: 50%; bottom: -18px;
        transform: translateX(-50%);
        font-family: var(--font-mono);
        font-size: 10px; letter-spacing: 0.1em;
        color: color-mix(in srgb, var(--sd-accent) 75%, var(--sd-ink));
        -webkit-mask: none; mask: none;
        white-space: nowrap;
      }

      /* ── Routine loader card — top-left rail, clear of the transcript. Glassy
         near-black panel echoing the WhatsApp card register. Fades + rises in on
         `start`, out on `done`. Fixed max-width so it never crowds the orb. ── */
      .routine-loader {
        position: fixed;
        left: 14px; top: 46px;
        z-index: 40;
        width: 208px; max-width: 44vw;
        padding: 12px 13px 11px;
        border-radius: var(--r-panel);
        /* Card v2 on chrome: a 1px --sd-line hairline (not a cyan-tinted border)
           plus the white inset top hairline for elevation. Glass stays (D1) —
           this is a floating chrome panel, not an inner content surface. */
        border: 1px solid var(--sd-line);
        background: color-mix(in srgb, var(--sd-box) 88%, transparent);
        backdrop-filter: blur(9px) saturate(120%);
        -webkit-backdrop-filter: blur(9px) saturate(120%);
        box-shadow: var(--sd-hairline-card),
                    0 10px 34px rgba(0, 0, 0, 0.5),
                    var(--glow-hud-subtle);
        opacity: 0;
        transform: translateY(-6px);
        transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
      }
      .routine-loader.visible { opacity: 1; transform: translateY(0); }

      .routine-loader-head {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 9px;
      }
      .routine-loader-dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--sd-accent);
        box-shadow: 0 0 8px color-mix(in srgb, var(--sd-accent) 80%, transparent);
        flex: none;
        animation: routine-dot-pulse 1.6s ease-in-out infinite;
      }
      /* On the composing beat the dot settles to a steady warm glow. */
      .routine-loader[data-phase="composing"] .routine-loader-dot,
      .routine-loader[data-phase="done"] .routine-loader-dot { animation: none; }
      @keyframes routine-dot-pulse {
        0%, 100% { opacity: 0.4; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1); }
      }
      .routine-loader-title {
        font-family: var(--font-mono);
        font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--sd-accent);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }

      .routine-loader-list {
        list-style: none; margin: 0; padding: 0;
        display: flex; flex-direction: column; gap: 5px;
      }
      .routine-row {
        display: flex; align-items: center; gap: 8px;
        font-family: var(--font-sans);
        font-size: 13.5px; line-height: 1.3;
        color: var(--sd-ink-faint);
        transition: color 0.3s ease, opacity 0.3s ease;
      }
      .routine-row-mark {
        flex: none;
        width: 14px; height: 14px; border-radius: 50%;
        border: 1.5px solid color-mix(in srgb, var(--sd-ink-faint) 60%, transparent);
        position: relative;
        transition: border-color 0.3s ease, background 0.3s ease;
      }
      /* Active: a thin cyan indeterminate spinner ring (only spinning motion in
         the card; calm, single revolution ~1s). */
      .routine-row[data-status="active"] { color: var(--sd-ink); }
      .routine-row[data-status="active"] .routine-row-mark {
        border-color: color-mix(in srgb, var(--sd-accent) 35%, transparent);
        border-top-color: var(--sd-accent);
        animation: routine-spin 0.9s linear infinite;
      }
      @keyframes routine-spin { to { transform: rotate(360deg); } }
      /* Done: filled cyan disc with a check drawn via ::after. */
      .routine-row[data-status="done"] { color: var(--sd-ink); }
      .routine-row[data-status="done"] .routine-row-mark {
        border-color: var(--sd-accent);
        background: color-mix(in srgb, var(--sd-accent) 22%, transparent);
      }
      .routine-row[data-status="done"] .routine-row-mark::after {
        content: "";
        position: absolute; left: 4px; top: 1px;
        width: 3.5px; height: 7px;
        border: solid var(--accent-hi);
        border-width: 0 1.6px 1.6px 0;
        transform: rotate(45deg);
      }
      /* Error: muted amber-red ring with a small ✕; the row copy dims, not shouts
         (a failed source is informational, not alarming). */
      .routine-row[data-status="error"] { color: color-mix(in srgb, var(--sd-ink) 55%, var(--sd-ink-faint)); }
      .routine-row[data-status="error"] .routine-row-mark {
        border-color: color-mix(in srgb, var(--ink-coral) 70%, transparent);
      }
      .routine-row[data-status="error"] .routine-row-mark::after {
        content: "✕";
        position: absolute; inset: 0;
        display: grid; place-items: center;
        font-size: 8px; line-height: 1; color: var(--ink-coral);
      }

      .routine-loader-phase {
        margin-top: 10px; padding-top: 8px;
        border-top: 1px solid var(--sd-line);
        font-family: var(--font-mono);
        font-size: 10px; letter-spacing: 0.06em;
        color: var(--sd-ink-faint);
        transition: color 0.3s ease;
      }
      .routine-loader[data-phase="composing"] .routine-loader-phase { color: var(--sd-accent); }
      .routine-loader[data-phase="done"] .routine-loader-phase {
        color: color-mix(in srgb, var(--sd-accent) 80%, var(--sd-ink));
      }

      /* Reduced-motion: keep the affordances, drop the animation. The ring still
         fills (as an instant step) and rows still tick, but nothing spins,
         pulses, or eases. */
      @media (prefers-reduced-motion: reduce) {
        .routine-ring,
        .routine-loader { transition: opacity 0.001s linear; }
        .routine-ring { transition-property: opacity, background; }
        .routine-loader-dot,
        .routine-row[data-status="active"] .routine-row-mark { animation: none; }
        .routine-row,
        .routine-row-mark,
        .routine-loader-phase { transition: none; }
      }

      /* ── Background-task loader chips — top-right rail, clear of the routine
         loader (top-left) and the transcript. One chip per in-flight dispatched
         action (a send, a screenshot describe, a long script), stacked and
         resolving independently. Same glassy near-black / cyan / mono register
         as the routine loader so they read as one system. ── */
      #background-tasks {
        position: fixed;
        right: 14px; top: 46px;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        max-width: 46vw;
        pointer-events: none;
      }
      #background-tasks:empty { display: none; }

      .task-chip {
        display: flex; align-items: center; gap: 8px;
        max-width: 100%;
        padding: 7px 11px;
        border-radius: var(--r-pill-inset);
        /* Card v2 on chrome: hairline + inset top hairline; glass kept (D1). */
        border: 1px solid var(--sd-line);
        background: color-mix(in srgb, var(--sd-box) 88%, transparent);
        backdrop-filter: blur(9px) saturate(120%);
        -webkit-backdrop-filter: blur(9px) saturate(120%);
        box-shadow: var(--sd-hairline-card),
                    0 8px 26px rgba(0, 0, 0, 0.5),
                    var(--glow-hud-subtle);
        animation: task-fade-in 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        transition: opacity 0.35s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }
      .task-label {
        font-family: var(--font-mono);
        font-size: 10.5px; letter-spacing: 0.04em;
        color: var(--sd-ink);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .task-dot {
        flex: none;
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--sd-accent);
        box-shadow: 0 0 8px color-mix(in srgb, var(--sd-accent) 80%, transparent);
        position: relative;
      }
      /* Running: the dot pulses (reuses the routine loader's cadence). */
      .task-chip[data-status="running"] .task-dot {
        animation: routine-dot-pulse 1.6s ease-in-out infinite;
      }
      /* Done: steady cyan dot with a small check drawn beside it via ::after. */
      .task-chip[data-status="done"] .task-dot {
        animation: none;
        background: var(--sd-accent);
      }
      .task-chip[data-status="done"] .task-dot::after {
        content: "";
        position: absolute; left: 8px; top: -1px;
        width: 3px; height: 6px;
        border: solid var(--accent-hi);
        border-width: 0 1.5px 1.5px 0;
        transform: rotate(45deg);
      }
      /* Failed: the dot + copy shift to the error token; a small ✕ marks it. */
      .task-chip[data-status="failed"] {
        border-color: color-mix(in srgb, var(--ink-coral) 45%, var(--sd-line));
      }
      .task-chip[data-status="failed"] .task-dot {
        animation: none;
        background: var(--ink-coral);
        box-shadow: 0 0 8px color-mix(in srgb, var(--ink-coral) 70%, transparent);
      }
      .task-chip[data-status="failed"] .task-label {
        color: color-mix(in srgb, var(--sd-ink) 60%, var(--ink-coral));
      }
      @keyframes task-fade-in {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .task-chip { animation: none; transition: opacity 0.001s linear; }
        .task-chip[data-status="running"] .task-dot { animation: none; }
      }

      /* ── Incoming-message notification toasts: a compact panel per new
         WhatsApp/iMessage message near the orb, same glassy near-black / cyan /
         mono register as the task chips + routine loader so they read as one
         system. Stacked bottom-center, above the orb, each fading out after a
         linger. Non-interactive (pointer-events: none) — the OPEN-the-chat side
         effect fires from the announcer, not a click. ── */
      #notification-toasts {
        position: fixed;
        left: 50%; bottom: 128px;
        transform: translateX(-50%);
        z-index: 41;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        max-width: 60vw;
        pointer-events: none;
      }
      #notification-toasts:empty { display: none; }

      .noti-toast {
        display: flex; align-items: baseline; gap: 8px;
        max-width: 100%;
        padding: 8px 13px;
        border-radius: var(--r-panel);
        /* Card v2 on chrome: hairline + inset top hairline; glass kept (D1). */
        border: 1px solid var(--sd-line);
        background: color-mix(in srgb, var(--sd-box) 90%, transparent);
        backdrop-filter: blur(10px) saturate(122%);
        -webkit-backdrop-filter: blur(10px) saturate(122%);
        box-shadow: var(--sd-hairline-card),
                    0 10px 30px rgba(0, 0, 0, 0.52),
                    var(--glow-hud-subtle);
        opacity: 0;
        animation: noti-toast-in 0.34s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transition: opacity 0.4s ease;
      }
      .noti-toast[data-leaving="true"] { opacity: 0; }
      .noti-channel {
        flex: none;
        font-family: var(--font-mono);
        font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--sd-accent);
      }
      .noti-sender {
        flex: none;
        font-family: var(--font-mono);
        font-size: 10.5px; letter-spacing: 0.03em;
        color: var(--sd-ink);
      }
      .noti-preview {
        min-width: 0;
        font-size: 11.5px; line-height: 1.3;
        color: color-mix(in srgb, var(--sd-ink) 78%, transparent);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      @keyframes noti-toast-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .noti-toast { animation: none; opacity: 1; transition: opacity 0.001s linear; }
      }

      /* ── Transcript: the scrollable middle region. Never overlaps anything.
         Auto-scrolls to the latest text; wraps; readable type. ── */
      .transcript {
        min-height: 0;              /* critical: allow the grid row to shrink */
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 14px;
        /* The transcript is the one inner CONTENT surface here (conversation
           text), so it goes SOLID sd (recessed --sd-dark-box), not translucent:
           §D1 keeps glass on chrome, content stays opaque. Hairline + inset top
           hairline for the card-v2 well. */
        border: 1px solid var(--sd-line);
        border-radius: var(--r-panel);
        background: var(--sd-dark-box);
        box-shadow: var(--sd-hairline-card);
        scroll-behavior: smooth;
      }
      /* Slim custom scrollbar (custom-scrollbar pattern). */
      .transcript::-webkit-scrollbar { width: 7px; }
      .transcript::-webkit-scrollbar-track { background: transparent; }
      .transcript::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, var(--sd-accent) 22%, var(--sd-line));
        border-radius: 999px;
      }
      .transcript::-webkit-scrollbar-thumb:hover {
        background: color-mix(in srgb, var(--sd-accent) 40%, var(--sd-line));
      }

      /* Empty-state hint, shown when there's no conversation yet. */
      .transcript-empty {
        margin: auto;
        text-align: center;
        color: var(--sd-ink-faint);
        font-size: 12.5px;
        line-height: 1.6;
        max-width: 260px;
      }
      .transcript.has-content .transcript-empty { display: none; }

      /* ── Region 2 wrapper: nested grid so the toolbar (auto) sits above the
         scroll region (1fr) without eating the transcript's flex height. ── */
      .transcript-region {
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 6px;
      }
      /* Slim toolbar strip. Hidden until the transcript has content, so an
         empty session shows only the idle hint — no orphaned control. */
      .transcript-toolbar {
        display: none;
        justify-content: flex-end;
        align-items: center;
        padding: 0 2px;
        min-height: 0;
      }
      .transcript-region:has(.transcript.has-content) .transcript-toolbar {
        display: flex;
      }
      /* Chrome button: mono, hairline border, cyan hover — matches HUD chrome. */
      .chrome-btn {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--sd-ink-faint);
        background: transparent;
        border: 1px solid var(--sd-line);
        border-radius: var(--r-chrome);
        padding: 3px 9px;
        cursor: pointer;
        transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }
      .chrome-btn:hover {
        color: var(--sd-accent);
        border-color: color-mix(in srgb, var(--sd-accent) 45%, var(--sd-line));
        background: color-mix(in srgb, var(--sd-accent) 8%, transparent);
      }
      .chrome-btn:active {
        background: color-mix(in srgb, var(--sd-accent) 16%, transparent);
      }
      .chrome-btn:disabled {
        opacity: 0.5;
        cursor: default;
        color: var(--sd-ink-faint);
        border-color: var(--sd-line);
        background: transparent;
      }

      /* A single turn bubble: the user line (right) or JARVIS line (left). */
      .turn {
        max-width: 100%;
        font-size: 14px;
        line-height: 1.55;
        letter-spacing: 0.01em;
        word-break: break-word;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .turn .who {
        font-family: var(--font-mono);
        font-size: 9.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--sd-ink-faint);
        margin-bottom: 3px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .turn .who .when {
        text-transform: none;
        letter-spacing: 0.02em;
        opacity: 0.55;
        font-variant-numeric: tabular-nums;
      }
      .turn.user .who { color: color-mix(in srgb, var(--sd-ink) 55%, var(--sd-ink-faint)); }
      .turn.jarvis .who { color: var(--sd-accent); }
      /* Turn text is Space Grotesk (the app sans) — the serif transcript is
         dead per oracle O1; body/transcript may not use EB Garamond. Kept a
         touch larger than the mono chrome so the conversation reads as the
         primary surface. */
      .turn .body { font-family: var(--font-sans); font-size: 15px; }
      .turn.user .body { color: color-mix(in srgb, var(--sd-ink) 80%, var(--sd-ink-faint)); }
      /* Optimistic placeholder while STT is still resolving — reads as
         "recognising", never as the user's final message. */
      .turn.user.pending .body { font-style: italic; opacity: 0.55; }
      .turn.jarvis .body { color: var(--sd-ink); }

      /* ── Footer: pinned invoke button + inline tool receipts ── */
      .hud-footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .footer-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      /* Inline action receipts ("▸ opening Calendar"), most-recent-first, capped. */
      .footer-receipts {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        max-height: 44px;
        overflow: hidden;
      }
      .footer-receipts:empty { display: none; }
      .footer-receipts .tool-call-item {
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.02em;
        color: var(--sd-ink-faint);
      }
      .footer-receipts .tool-call-item.action-flash { color: var(--sd-accent); }

      /* Primary invoke button — restrained, glassy. Guaranteed fallback. */
      .invoke-btn {
        appearance: none;
        background: color-mix(in srgb, var(--sd-accent) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--sd-accent) 35%, var(--sd-line));
        color: var(--sd-ink);
        padding: 9px 18px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
        display: inline-flex; align-items: center; gap: 9px;
        transition: background 0.15s, border-color 0.15s, transform 0.05s;
      }
      .invoke-btn:hover { background: color-mix(in srgb, var(--sd-accent) 18%, transparent); border-color: color-mix(in srgb, var(--sd-accent) 55%, var(--sd-line)); }
      .invoke-btn:active { transform: scale(0.98); }
      .invoke-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .invoke-btn[data-recording="true"] {
        background: color-mix(in srgb, var(--sd-accent) 22%, transparent);
        border-color: var(--sd-accent);
        color: var(--accent-hi);
      }
      .invoke-btn .shortcut-label {
        font-family: var(--font-mono);
        font-size: 10px; color: var(--sd-ink-faint);
        padding: 1px 6px; border-radius: 4px;
        background: color-mix(in srgb, var(--sd-ink) 8%, transparent);
      }
      /* Hidden extend button — retained for the capture module's wiring only. */
      #extend-btn { display: none !important; }

      /* Cancel affordance — appears only while recording. */
      .cancel-btn {
        appearance: none;
        background: transparent;
        border: 1px solid color-mix(in srgb, var(--ink-coral) 45%, var(--sd-line));
        color: var(--ink-coral);
        padding: 4px 12px; border-radius: 999px;
        font-size: 11px; cursor: pointer; font-family: inherit;
        opacity: 0; pointer-events: none; transition: opacity 0.2s;
      }
      body[data-jarvis-state="listening"] .cancel-btn { opacity: 0.85; pointer-events: auto; }
      .cancel-btn:hover { background: color-mix(in srgb, var(--ink-coral) 15%, transparent); }
      .cancel-btn:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

      /* ── Settings drawer (behind a gear toggle; auto-hidden by default) ── */
      .gear-btn {
        position: fixed; top: 12px; right: 12px;
        /* The studio layers (#studio-widget-root at z-index 2, its foreground
           scrims, and any widget) paint ABOVE the gear when it has no stacking
           context of its own, so the click landed on a studio layer instead of
           the button. Lift the gear above the whole studio stack and force its
           own pointer surface so it is always the top hit at the corner. */
        z-index: 70; pointer-events: auto;
        appearance: none; background: transparent; border: none;
        color: var(--sd-ink-faint); cursor: pointer; font-size: 15px;
        padding: 6px; border-radius: 8px; line-height: 1;
        transition: color 0.15s, background 0.15s;
      }
      .gear-btn:hover { color: var(--sd-ink); background: color-mix(in srgb, var(--sd-ink) 6%, transparent); }
      /* The old vanilla settings drawer (`.settings`, its rows, toggles, list
         editors, and section chrome) was consolidated into the one React
         Settings widget by unit u7, which deleted its markup. The orphaned rules
         are excised here. The `select` / `input[type=password]` element rules
         below are KEPT: the React widget still renders those elements in this
         document, and although its inline styles override them, they remain live
         markup. `.gear-btn` (above) and `.sr-only` (below) also stay — the gear
         still summons the widget and the a11y utility wraps hidden controls. */
      select {
        background: var(--sd-box); color: var(--sd-ink); border: 1px solid var(--sd-line);
        border-radius: 6px; padding: 4px 7px; font-size: 12px; font-family: inherit;
        cursor: pointer; outline: none;
      }
      select:focus { border-color: var(--sd-accent); }
      input[type=password] {
        font-family: var(--font-mono); font-size: 12px; width: 200px; padding: 4px 8px;
        border-radius: 5px; border: 1px solid var(--sd-line); background: var(--sd-box); color: var(--sd-ink);
      }
      /* Screen-reader-only wrappers for the hidden capture-control elements the
         main.ts wiring still reads (stop-btn-idle, live-text, etc.). */
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

      /* WhatsApp pairing overlay — glassy dark card over a dimmed HUD. */
      .wa-qr-overlay {
        position: fixed; inset: 0; z-index: 50;
        display: flex; align-items: center; justify-content: center;
        background: color-mix(in srgb, var(--sd-app) 78%, transparent);
        backdrop-filter: blur(8px) saturate(120%);
        -webkit-backdrop-filter: blur(8px) saturate(120%);
      }
      .wa-qr-overlay[hidden] { display: none; }
      .wa-qr-card {
        display: flex; flex-direction: column; align-items: center; gap: 14px;
        padding: 22px 24px 20px;
        border-radius: 14px;
        border: 1px solid color-mix(in srgb, var(--sd-accent) 30%, var(--sd-line));
        background: color-mix(in srgb, var(--sd-box) 82%, transparent);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55),
                    0 0 20px color-mix(in srgb, var(--sd-accent) 22%, transparent);
      }
      .wa-qr-title {
        font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--sd-accent);
      }
      .wa-qr-canvas {
        width: 240px; height: 240px; border-radius: 8px;
        background: #fff; padding: 10px; box-sizing: border-box;
      }
      .wa-qr-caption {
        font-family: var(--font-sans); font-size: 14px; line-height: 1.4;
        max-width: 240px; text-align: center; color: var(--sd-ink);
      }
    </style>
  </head>
  <body data-jarvis-state="idle">
    <!-- React-owned full-window studio canvas. Legacy HUD controls and overlays
         stay later in the DOM so they remain interactive above this layer. -->
    <div id="studio-root"></div>
    <button class="disconnect-banner" id="disconnect-banner" type="button">
      ⚠ Disconnected from JARVIS server — tap to check the device token in Settings
    </button>
    <!-- WhatsApp first-run pairing overlay. Hidden until the bridge sidecar
         emits a QR (whatsapp-qr); dismissed on whatsapp-ready. -->
    <div class="wa-qr-overlay" id="wa-qr-overlay" hidden>
      <div class="wa-qr-card">
        <div class="wa-qr-title">Link WhatsApp</div>
        <canvas class="wa-qr-canvas" id="wa-qr-canvas" width="240" height="240" aria-label="WhatsApp linking QR code"></canvas>
        <div class="wa-qr-caption">Scan with WhatsApp → Linked Devices to connect JARVIS</div>
      </div>
    </div>
    <main class="stage">
      <!-- Region 1: compact status and routine progress. Never scrolls. -->
      <header class="hud-header">
        <div class="routine-ring-slot">
          <!-- Hidden until the loader is visible; the label reads "3/5" then
               "✓". CSS-only fill via the --progress angle var. -->
          <div class="routine-ring" id="routine-ring" aria-hidden="true">
            <span class="routine-ring-label" id="routine-ring-label"></span>
          </div>
        </div>
        <div class="status-line" id="status-line">
          <span class="conn-dot" aria-hidden="true"></span><span id="status-word">standing by</span>
          <!-- Voice-degraded indicator: shown only while ElevenLabs is down and
               JARVIS is speaking through the local fallback voice. Hidden on
               recovery. -->
          <span
            class="voice-degraded"
            id="voice-degraded"
            hidden
            title="ElevenLabs unavailable — using local voice"
          >voice degraded</span>
        </div>
        <div class="ack-strip" id="ack-strip" aria-hidden="true"></div>
      </header>

      <!-- Routine loader card (src/hud/routine-loader.ts). A fixed glassy panel
           on the top-left rail, clear of the transcript scroll region, that
           lists every source of a synthesize routine and ticks each as it
           settles. Visible only while a routine is in flight; its compact ring
           appears above the status line. Never overlaps the transcript. -->
      <aside class="routine-loader" id="routine-loader" aria-live="polite">
        <div class="routine-loader-head">
          <span class="routine-loader-dot" aria-hidden="true"></span>
          <span class="routine-loader-title" id="routine-loader-title">Routine</span>
        </div>
        <ul class="routine-loader-list" id="routine-loader-list"></ul>
        <div class="routine-loader-phase" id="routine-loader-phase">One moment…</div>
      </aside>

      <!-- Region 2 wrapper: occupies the single 1fr grid row. A nested grid
           stacks a slim toolbar (auto) over the scroll region (1fr) so adding
           the toolbar never steals the transcript's flex height. -->
      <div class="transcript-region">
        <!-- Transcript toolbar: minimal HUD chrome above the scroll region.
             Holds the Clear control, which empties the visible transcript AND
             wipes the server-side conversation memory (jarvis_turns) so a fresh
             session never inherits stale turns. Hidden until there's content. -->
        <div class="transcript-toolbar" id="transcript-toolbar">
          <button
            class="chrome-btn"
            id="clear-convo-btn"
            type="button"
            title="Clear conversation — wipes the transcript and JARVIS's memory of it"
          >Clear</button>
        </div>

        <!-- The ONLY scroll area. Conversation turns land here and it
             auto-scrolls to the latest. Wraps; readable type; never overlaps. -->
        <section class="transcript" id="transcript" aria-live="polite">
          <div class="transcript-empty" id="transcript-empty">
            Press <strong>Talk to JARVIS</strong> or ⌘⌃J to begin.<br />
            Your words and JARVIS's replies appear here.
          </div>
        </section>
      </div>

      <!-- Region 3: pinned footer — invoke button + inline action receipts. -->
      <footer class="hud-footer">
        <div class="footer-receipts" id="tool-calls-footer" aria-live="polite"></div>
        <div class="footer-actions">
          <button class="invoke-btn" id="wake-btn" type="button">
            Talk to JARVIS
            <span class="shortcut-label">⌘⌃J</span>
          </button>
          <button class="cancel-btn" id="cancel-btn">Cancel</button>
        </div>
      </footer>

      <!-- Retained for capture-module wiring; visually hidden. -->
      <button id="extend-btn" type="button" aria-hidden="true"></button>
    </main>

    <!-- Settings trigger. The gear (and the disconnect banner) summon the ONE
         React Settings widget on the studio stage — main.ts wires both. The
         legacy DOM settings drawer that used to live here was consolidated into
         that surface (unit u7); everything it held now has a home there. -->
    <button class="gear-btn" id="gear-btn" type="button" title="Settings" aria-label="Settings">⚙</button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
