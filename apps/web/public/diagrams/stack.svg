<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" role="img" aria-label="Hyperpolymath stack — Web app, Desktop app middleman, and Polypad hardware, all feeding the same backend">
  <defs>
    <linearGradient id="keycap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="hsl(235 15% 30%)"/>
      <stop offset="100%" stop-color="hsl(235 15% 22%)"/>
    </linearGradient>
  </defs>

  <!-- Page (near-black indigo ground) -->
  <rect x="0" y="0" width="1200" height="980" rx="24" fill="hsl(235 16% 9%)"/>

  <!-- Frame: single sd-line hairline (no neu/blur/glow) -->
  <rect x="30.5" y="30.5" width="1139" height="919" rx="17.5" fill="hsl(235 16% 10%)" stroke="hsl(235 15% 23%)"/>
  <!-- inset top hairline (WidgetCard grammar) -->
  <rect x="31" y="31" width="1138" height="918" rx="17" fill="none" stroke="hsl(235 15% 34%)" stroke-opacity="0.35"/>

  <!-- Top crest meta -->
  <g transform="translate(80 76)" fill="#22D3EE">
    <circle cx="0" cy="0" r="2.2"/>
    <circle cx="12" cy="0" r="2.2"/>
    <circle cx="24" cy="0" r="2.2"/>
  </g>
  <text x="116" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.4" fill="hsl(235 10% 55%)">THE STACK · INPUT SURFACES</text>
  <text x="1120" y="80" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.4" fill="hsl(235 10% 55%)">FIG. 01  ·  THREE PILLARS</text>

  <!-- Title -->
  <text x="600" y="146" text-anchor="middle" font-family="system-ui, 'Space Grotesk', 'Segoe UI', sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5" fill="hsl(235 35% 92%)">Three surfaces. One agent.</text>
  <text x="600" y="180" text-anchor="middle" font-family="system-ui, 'Space Grotesk', 'Segoe UI', sans-serif" font-size="19" fill="hsl(235 10% 70%)">Type, click, or speak. Every sentence lands in the same backend.</text>

  <!-- ============================================================ -->
  <!-- Three column cards                                            -->
  <!-- ============================================================ -->

  <!-- ───── Card 1: Web App ───── -->
  <g>
    <rect x="80" y="220" width="320" height="460" rx="14" fill="hsl(235 15% 15%)" stroke="hsl(235 15% 23%)"/>
    <rect x="80.5" y="220.5" width="319" height="18" rx="13.5" fill="none" stroke="hsl(235 15% 34%)" stroke-opacity="0.3"/>
    <text x="116" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.2" fill="hsl(235 10% 55%)">01  ·  WEB</text>

    <!-- Browser glyph (centered horizontally in card) -->
    <g transform="translate(170 304)">
      <rect x="0" y="0" width="140" height="100" rx="6" fill="hsl(235 15% 20%)" stroke="hsl(235 15% 30%)" stroke-width="1.2"/>
      <rect x="0" y="0" width="140" height="18" rx="6" fill="hsl(235 15% 25%)" stroke="hsl(235 15% 30%)" stroke-width="1.2"/>
      <circle cx="9" cy="9" r="2.2" fill="#22D3EE"/>
      <circle cx="17" cy="9" r="2.2" fill="hsl(235 10% 55%)"/>
      <circle cx="25" cy="9" r="2.2" fill="hsl(235 10% 55%)"/>
      <rect x="40" y="5" width="86" height="8" rx="2" fill="hsl(235 15% 15%)" stroke="hsl(235 15% 30%)"/>
      <line x1="14" y1="40" x2="126" y2="40" stroke="hsl(235 10% 55%)" stroke-opacity="0.7" stroke-width="1"/>
      <line x1="14" y1="54" x2="100" y2="54" stroke="hsl(235 10% 55%)" stroke-opacity="0.5" stroke-width="1"/>
      <line x1="14" y1="68" x2="112" y2="68" stroke="hsl(235 10% 55%)" stroke-opacity="0.5" stroke-width="1"/>
      <line x1="14" y1="82" x2="70" y2="82" stroke="hsl(235 10% 55%)" stroke-opacity="0.5" stroke-width="1"/>
    </g>

    <text x="240" y="456" text-anchor="middle" font-family="system-ui, 'Space Grotesk', 'Segoe UI', sans-serif" font-size="27" font-weight="600" fill="hsl(235 35% 92%)">Web App</text>
    <text x="240" y="486" text-anchor="middle" font-family="system-ui, 'Space Grotesk', 'Segoe UI', sans-serif" font-size="16" fill="hsl(235 10% 70%)">Next.js 16 · Supabase</text>

    <line x1="128" y1="520" x2="352" y2="520" stroke="hsl(235 15% 23%)"/>

    <text x="116" y="554" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="hsl(235 10% 70%)">·  browser, anywhere</text>
    <text x="116" y="584" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="hsl(235 10% 70%)">·  same auth, same data</text>
    <text x="116" y="614" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="hsl(235 10% 70%)">·  laptops + phones</text>
  </g>

  <!-- ───── Card 2: Desktop (the middleman, default) ───── -->
  <g>
    <rect x="440" y="220" width="320" height="460" rx="14" fill="hsl(235 15% 15%)" stroke="hsl(235 15% 30%)"/>
    <!-- Highlight ribbon — this is the default path (cyan accent) -->
    <rect x="440" y="220" width="320" height="22" rx="14" fill="#22D3EE"/>
    <rect x="440" y="232" width="320" height="10" fill="#22D3EE"/>
    <text x="600" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2.4" fill="hsl(235 16% 9%)">DEFAULT  ·  THE MIDDLEMAN</text>

    <text x="476" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.2" fill="hsl(235 10% 55%)">02  ·  DESKTOP</text>

    <!-- Mac window glyph -->
    <g transform="translate(490 314)">
      <rect x="0" y="0" width="220" height="100" rx="8" fill="hsl(235 15% 20%)" stroke="hsl(235 15% 30%)" stroke-width="1.2"/>
      <rect x="0" y="0" width="220" height="20" rx="8" fill="hsl(235 15% 25%)" stroke="hsl(235 15% 30%)" stroke-width="1.2"/>
      <circle cx="10" cy="10" r="2.5" fill="#22D3EE"/>
      <circle cx="20" cy="10" r="2.5" fill="hsl(235 10% 55%)"/>
      <circle cx="30" cy="10" r="2.5" fill="hsl(235 10% 55%)"/>
      <text x="110" y="54" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#22D3EE">$ _</text>
      <text x="110" y="80" text-anchor="middle" font-family="system-ui, 'Space Grotesk', 'Segoe UI', sans-serif" font-size="12" fill="hsl(235 10% 70%)">talk to JARVIS</text>
    </g>

    <!-- Hotkey chips (centered horizontally) -->
    <g transform="translate(522 450)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">
      <rect x="0" y="0" width="36" height="26" rx="5" fill="hsl(235 15% 20%)" stroke="hsl(235 15% 30%)"/>
      <text x="18" y="17" text-anchor="middle" fill="hsl(235 35% 92%)">⌘</text>
      <rect x="44" y="0" width="36" height="26" rx="5" fill="hsl(235 15% 20%)" stroke="hsl(235 15% 30%)"/>
      <text x="62" y="17" text-anchor="middle" fill="hsl(235 35% 92%)">⌥</text>
      <rect x="88" y="0" width="36" height="26" rx="5" fill="hsl(235 15% 20%)" stroke="hsl(235 15% 30%)"/>
      <text x="106" y="17" text-anchor="middle" fill="hsl(235 35% 92%)">J</text>
      <text x="138" y="18" font-family="system-ui, 'Space Grotesk', 'Segoe UI', sans-serif" font-size="13" fill="hsl(235 10% 60%)">global hotkey</text>
    </g>

    <text x="600" y="540" text-anchor="middle" font-family="system-ui, 'Space Grotesk', 'Segoe UI', sans-serif" font-size="27" font-weight="600" fill="hsl(235 35% 92%)">Desktop App</text>
    <text x="600" y="568" text-anchor="middle" font-family="system-ui, 'Space Grotesk', 'Segoe UI', sans-serif" font-size="16" fill="hsl(235 10% 70%)">Tauri 2 · Rust shell</text>

    <line x1="488" y1="600" x2="712" y2="600" stroke="hsl(235 15% 23%)"/>

    <text x="600" y="634" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="hsl(235 10% 70%)">menu-bar resident  ·  mic opt-in only</text>
  </g>

  <!-- ───── Card 3: Polypad (optional hardware) ───── -->
  <g>
    <rect x="800" y="220" width="320" height="460" rx="14" fill="hsl(235 15% 15%)" stroke="hsl(235 15% 23%)"/>
    <rect x="800.5" y="220.5" width="319" height="18" rx="13.5" fill="none" stroke="hsl(235 15% 34%)" stroke-opacity="0.3"/>
    <text x="836" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.2" fill="hsl(235 10% 55%)">03  ·  POLYPAD  ·  OPTIONAL</text>

    <!-- Polypad — chunky enclosure with a recessed top plate.
         Body is drawn as a 2.5D box: top face, a front-edge strip, and a
         right-edge strip suggest real depth without forcing perspective on
         the plate contents (kept axis-aligned for legibility). -->
    <g transform="translate(840 296) scale(0.8)">
      <!-- Cast shadow under the box (solid dim, no blur) -->
      <ellipse cx="155" cy="128" rx="140" ry="6" fill="hsl(235 16% 5%)" fill-opacity="0.55"/>

      <!-- Right-side depth strip -->
      <path d="M 282 16 L 300 26 L 300 122 L 282 112 Z" fill="hsl(235 15% 8%)" stroke="hsl(235 15% 4%)" stroke-width="0.8"/>

      <!-- Front-edge depth strip — the lower lip of the case -->
      <path d="M 8 112 L 282 112 L 300 122 L 26 122 Z" fill="hsl(235 15% 10%)" stroke="hsl(235 15% 4%)" stroke-width="0.8"/>

      <!-- Top body — the dominant face -->
      <rect x="8" y="16" width="274" height="96" rx="2" fill="hsl(235 15% 13%)" stroke="hsl(235 15% 6%)" stroke-width="1"/>

      <!-- Subtle highlight along the top edge -->
      <line x1="14" y1="20" x2="276" y2="20" stroke="hsl(235 15% 34%)" stroke-opacity="0.35"/>

      <!-- Recessed plate (sunk into the top face) -->
      <rect x="34" y="28" width="222" height="72" rx="2" fill="hsl(235 15% 20%)" stroke="hsl(235 15% 9%)" stroke-width="1"/>
      <!-- Inset shadow on plate to read as recessed -->
      <rect x="34" y="28" width="222" height="3" fill="hsl(235 16% 6%)" fill-opacity="0.6"/>
      <rect x="34" y="28" width="3" height="72" fill="hsl(235 16% 6%)" fill-opacity="0.6"/>

      <!-- 4 × 3 key grid (left ~75% of the plate); kiwi badge on the right -->
      <g fill="url(#keycap)" stroke="hsl(235 15% 10%)" stroke-width="0.9">
        <rect x="46"  y="36" width="26" height="18" rx="3"/>
        <rect x="76"  y="36" width="26" height="18" rx="3"/>
        <rect x="106" y="36" width="26" height="18" rx="3"/>
        <rect x="136" y="36" width="26" height="18" rx="3"/>

        <rect x="46"  y="58" width="26" height="18" rx="3"/>
        <rect x="76"  y="58" width="26" height="18" rx="3"/>
        <rect x="106" y="58" width="26" height="18" rx="3"/>
        <rect x="136" y="58" width="26" height="18" rx="3"/>

        <rect x="46"  y="80" width="26" height="14" rx="3"/>
        <rect x="76"  y="80" width="26" height="14" rx="3"/>
        <rect x="106" y="80" width="26" height="14" rx="3"/>
        <rect x="136" y="80" width="26" height="14" rx="3"/>
      </g>

      <!-- tiny keycap top-edge highlight -->
      <g fill="hsl(235 15% 40%)" fill-opacity="0.4">
        <rect x="48"  y="37" width="22" height="2"/>
        <rect x="78"  y="37" width="22" height="2"/>
        <rect x="108" y="37" width="22" height="2"/>
        <rect x="138" y="37" width="22" height="2"/>
      </g>

      <!-- Wake-word LED — cyan accent (the photo's white dot) -->
      <circle cx="89" cy="67" r="2.3" fill="#22D3EE"/>
      <circle cx="89" cy="67" r="4.6" fill="none" stroke="#22D3EE" stroke-opacity="0.5"/>

      <!-- Kiwi badge on the right side of the plate (cyan) -->
      <g transform="translate(186 46) scale(1.25)" fill="#22D3EE">
        <path d="m20.741,5.991c.21-.595.299-1.234.243-1.88-.114-1.326-.812-2.532-1.913-3.309-1.422-1.002-3.378-1.072-4.87-.174-.307.185-.59.403-.841.647-.807.786-2.119,1.723-3.788,1.723h-.794C4.18,2.998.334,6.462.022,10.884c-.174,2.468.725,4.883,2.468,6.625.844.844,1.848,1.484,2.938,1.906l.573,4.583h2.191l-.499-4.04c.271.026.544.04.818.04.201,0,.403-.007.604-.021.447-.032.881-.108,1.305-.209l.529,4.231h2.168l-.706-4.987c2.729-1.469,4.589-4.425,4.589-7.791l.021-2.262c.615-.069,1.187-.271,1.708-.568,3.845,3.229,4.272,8.608,4.272,8.608h1c0-5.446-2.104-9.299-3.259-11.007Zm-3.943.98c-1.025.115-1.798.952-1.798,1.947v2.302c0,3.553-2.647,6.523-6.026,6.761-1.891.131-3.737-.555-5.07-1.887-1.333-1.333-2.021-3.181-1.887-5.071.238-3.379,3.208-6.026,6.761-6.026h.794c1.852,0,3.645-.792,5.183-2.29.141-.137.301-.261.477-.366.823-.495,1.901-.458,2.686.095.627.442,1.008,1.098,1.073,1.846.063.737-.2,1.46-.723,1.983-.398.398-.907.642-1.47.705Zm1.202-2.473c0,.828-.672,1.5-1.5,1.5s-1.5-.672-1.5-1.5.672-1.5,1.5-1.5,1.5.672,1.5,1.5Z"/>
      </g>

    </g>

    <text x="960" y="456" text-anchor="middle" font-family="system-ui, 'Space Grotesk', 'Segoe UI', sans-serif" font-size="27" font-weight="600" fill="hsl(235 35% 92%)">Polypad</text>
    <text x="960" y="486" text-anchor="middle" font-family="system-ui, 'Space Grotesk', 'Segoe UI', sans-serif" font-size="16" fill="hsl(235 10% 70%)">custom PCB · open-source</text>

    <line x1="848" y1="520" x2="1072" y2="520" stroke="hsl(235 15% 23%)"/>

    <text x="836" y="554" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="0.4" fill="hsl(235 10% 70%)">·  4×3 Cherry MX Red mechanical</text>
    <text x="836" y="582" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="0.4" fill="hsl(235 10% 70%)">·  DFRobot on-device "Hey JARVIS"</text>
    <text x="836" y="610" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="0.4" fill="hsl(235 10% 70%)">·  ESP32 (wake)  ·  KB2040 + KMK (keys)</text>
    <text x="836" y="638" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="0.4" fill="hsl(235 10% 70%)">·  USB-serial → desktop bridge</text>
  </g>

  <!-- ============================================================ -->
  <!-- Confluence diagram                                             -->
  <!-- ============================================================ -->

  <!-- Web → backend -->
  <line x1="240" y1="700" x2="240" y2="750" stroke="hsl(235 10% 55%)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <polygon points="240,756 235,748 245,748" fill="hsl(235 10% 60%)"/>

  <!-- Desktop → backend (solid cyan; default path) -->
  <line x1="600" y1="700" x2="600" y2="750" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="600,758 593,748 607,748" fill="#22D3EE"/>

  <!-- Polypad → backend -->
  <line x1="960" y1="700" x2="960" y2="750" stroke="hsl(235 10% 55%)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <polygon points="960,756 955,748 965,748" fill="hsl(235 10% 60%)"/>

  <!-- Backend slab (darker box, cyan top hairline) -->
  <rect x="200" y="760" width="800" height="72" rx="10" fill="hsl(235 16% 11%)" stroke="hsl(235 15% 23%)"/>
  <rect x="200" y="760" width="800" height="1.5" rx="0.75" fill="#22D3EE" fill-opacity="0.7"/>
  <text x="600" y="792" text-anchor="middle" font-family="system-ui, 'Space Grotesk', 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="hsl(235 35% 92%)">
    <tspan font-weight="800" fill="#22D3EE">JARVIS</tspan>  ·  Hyperpolymath Backend
  </text>
  <text x="600" y="816" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.2" fill="hsl(235 10% 70%)">CLAUDE SONNET 4.6  ·  SUPABASE POSTGRES  ·  REALTIME  ·  GOOGLE CALENDAR</text>

  <!-- Footer line -->
  <text x="80" y="948" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2" fill="hsl(235 10% 50%)">❦  HYPERPOLYMATH STACK · FIG. 01</text>
</svg>
